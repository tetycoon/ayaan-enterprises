<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1b2d" />
      <stop offset="60%" stop-color="#142c47" />
      <stop offset="100%" stop-color="#0f2238" />
    </linearGradient>

    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#193757" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#244d78" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102136" />
      <stop offset="100%" stop-color="#091320" />
    </linearGradient>

    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5bf" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#00e5bf" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00e5bf" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a889b" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#b0bcc9" />
      <stop offset="100%" stop-color="#5a6878" />
    </linearGradient>

    <linearGradient id="uniformGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#12253d" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#935b38" />
      <stop offset="100%" stop-color="#6e3f22" />
    </linearGradient>

    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a88f" />
      <stop offset="100%" stop-color="#005e50" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Wall -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- Ambient Teal Lighting Glow -->
  <circle cx="512" cy="460" r="420" fill="url(#tealGlow)" />

  <!-- Tech Park Glass Windows in Background -->
  <g opacity="0.35">
    <rect x="80" y="80" width="240" height="420" rx="6" fill="url(#windowGrad)" stroke="#305a88" stroke-width="3" />
    <line x1="200" y1="80" x2="200" y2="500" stroke="#305a88" stroke-width="2" />
    <line x1="80" y1="280" x2="320" y2="280" stroke="#305a88" stroke-width="2" />

    <rect x="390" y="80" width="240" height="420" rx="6" fill="url(#windowGrad)" stroke="#305a88" stroke-width="3" />
    <line x1="510" y1="80" x2="510" y2="500" stroke="#305a88" stroke-width="2" />
    <line x1="390" y1="280" x2="630" y2="280" stroke="#305a88" stroke-width="2" />

    <rect x="700" y="80" width="240" height="420" rx="6" fill="url(#windowGrad)" stroke="#305a88" stroke-width="3" />
    <line x1="820" y1="80" x2="820" y2="500" stroke="#305a88" stroke-width="2" />
    <line x1="700" y1="280" x2="940" y2="280" stroke="#305a88" stroke-width="2" />
  </g>

  <!-- Corporate Carpet Floor -->
  <path d="M0,640 L1024,640 L1024,1024 L0,1024 Z" fill="url(#floorGrad)" />
  <line x1="0" y1="640" x2="1024" y2="640" stroke="#00e5bf" stroke-opacity="0.3" stroke-width="2" />

  <!-- Floor Shadows for Chair, Technician, and Toolbox -->
  <ellipse cx="680" cy="850" rx="220" ry="32" fill="#050a12" opacity="0.75" />
  <ellipse cx="360" cy="860" rx="160" ry="28" fill="#050a12" opacity="0.75" />
  <ellipse cx="180" cy="890" rx="100" ry="20" fill="#050a12" opacity="0.65" />

  <!-- ==================== UPTURNED OFFICE CHAIR ==================== -->
  <g transform="translate(680, 680) scale(1.15)">
    <!-- Backrest resting on floor -->
    <rect x="-140" y="-120" width="180" height="220" rx="36" fill="#1b2430" stroke="#2b384a" stroke-width="6" />
    <!-- Mesh inset in backrest -->
    <rect x="-125" y="-105" width="150" height="190" rx="26" fill="url(#meshGrad)" opacity="0.9" />
    <rect x="-115" y="-40" width="130" height="20" rx="10" fill="#00e5bf" opacity="0.35" /> <!-- Lumbar Support -->

    <!-- Seat cushion -->
    <rect x="-60" y="-180" width="200" height="80" rx="28" fill="#152130" stroke="#2b384a" stroke-width="5" />
    <rect x="-50" y="-170" width="180" height="60" rx="20" fill="#1a324d" />

    <!-- Tilt Mechanism under seat -->
    <rect x="20" y="-120" width="90" height="50" rx="8" fill="#202b38" stroke="#3b4d63" stroke-width="3" />
    <!-- Synchro Tension knob -->
    <circle cx="90" cy="-95" r="14" fill="#0e1722" stroke="#485c75" stroke-width="3" />

    <!-- Hydraulic Gas Lift Cylinder (being serviced) -->
    <rect x="55" y="-70" width="24" height="110" rx="5" fill="url(#chromeGrad)" filter="url(#softShadow)" />
    <rect x="52" y="-10" width="30" height="40" rx="3" fill="#151b22" /> <!-- Cylinder outer collar -->

    <!-- 5-Star Chrome Star Base (raised upwards for servicing) -->
    <g transform="translate(67, 40)">
      <!-- Central hub -->
      <circle cx="0" cy="0" r="22" fill="#202b38" stroke="url(#chromeGrad)" stroke-width="5" />
      <!-- Legs of the star base -->
      <line x1="0" y1="0" x2="-110" y2="-40" stroke="url(#chromeGrad)" stroke-width="16" stroke-linecap="round" />
      <line x1="0" y1="0" x2="110" y2="-35" stroke="url(#chromeGrad)" stroke-width="16" stroke-linecap="round" />
      <line x1="0" y1="0" x2="-80" y2="70" stroke="url(#chromeGrad)" stroke-width="16" stroke-linecap="round" />
      <line x1="0" y1="0" x2="95" y2="65" stroke="url(#chromeGrad)" stroke-width="16" stroke-linecap="round" />
      <line x1="0" y1="0" x2="0" y2="-90" stroke="url(#chromeGrad)" stroke-width="16" stroke-linecap="round" />

      <!-- Nylon Twin-Wheel Castors -->
      <circle cx="-110" cy="-40" r="14" fill="#11161d" stroke="#374556" stroke-width="3" />
      <circle cx="110" cy="-35" r="14" fill="#11161d" stroke="#374556" stroke-width="3" />
      <circle cx="-80" cy="70" r="14" fill="#11161d" stroke="#374556" stroke-width="3" />
      <circle cx="95" cy="65" r="14" fill="#11161d" stroke="#374556" stroke-width="3" />
      <circle cx="0" cy="-90" r="14" fill="#11161d" stroke="#374556" stroke-width="3" />
    </g>
  </g>

  <!-- ==================== SOUTH INDIAN TECHNICIAN ==================== -->
  <g transform="translate(360, 560)">
    <!-- Lower Body / Kneeling Legs in Navy Cargo Trousers -->
    <!-- Right leg kneeling on ground -->
    <path d="M-40,160 Q-20,280 -10,310 L50,310 Q40,250 10,160 Z" fill="#10233b" />
    <!-- Safety work boot on floor -->
    <path d="M-30,300 L70,300 C85,300 85,325 65,325 L-40,325 C-50,325 -50,300 -30,300 Z" fill="#0b0e12" stroke="#202a36" stroke-width="3" />
    <!-- Left bent knee forward -->
    <path d="M-10,140 Q60,180 100,240 L100,290 Q60,280 20,240 Q-10,200 -20,150 Z" fill="#173152" />
    <path d="M80,280 L140,280 C155,280 155,305 135,305 L70,305 C60,305 60,280 80,280 Z" fill="#0b0e12" stroke="#202a36" stroke-width="3" />

    <!-- Torso / Navy Corporate Work Shirt -->
    <path d="M-60,30 Q-70,120 -40,170 Q0,185 50,160 Q70,110 50,20 Q0,-5 -60,30 Z" fill="url(#uniformGrad)" filter="url(#softShadow)" />
    <!-- Yellow/Teal Hi-Vis Trim on shoulder & pocket -->
    <line x1="-50" y1="35" x2="35" y2="28" stroke="#00e5bf" stroke-width="4" stroke-linecap="round" />
    <!-- Technician ID Card Badge / Ayaan Logo -->
    <rect x="-35" y="65" width="28" height="36" rx="4" fill="#ffffff" />
    <rect x="-33" y="68" width="24" height="8" rx="2" fill="#00e5bf" />
    <circle cx="-21" cy="85" r="5" fill="#1a324d" />
    <line x1="-31" y1="95" x2="-11" y2="95" stroke="#1a324d" stroke-width="2" />

    <!-- Shirt Collar -->
    <polygon points="-25,12 5,10 -10,32" fill="#10233b" />
    <polygon points="-25,12 -55,18 -38,36" fill="#0c1b2e" />

    <!-- Neck with authentic warm South Indian skin tone -->
    <path d="M-36,5 L-12,5 L-10,22 L-34,22 Z" fill="url(#skinGrad)" />

    <!-- Left Arm reaching toward the chair mechanism -->
    <path d="M30,35 Q90,70 140,95 Q145,115 125,120 Q80,95 20,60 Z" fill="#1e3a5f" />
    <!-- Forearm & Gloved Hand holding precision wrench -->
    <path d="M130,95 L180,120 L165,140 L115,115 Z" fill="url(#skinGrad)" />
    <!-- Black mechanic work glove -->
    <ellipse cx="185" cy="126" rx="18" ry="14" fill="#1c2530" stroke="#334456" stroke-width="2" />
    <!-- Chrome Spanner / Wrench on gas cylinder -->
    <path d="M175,130 L230,120 L245,100 L255,108 L240,130 L180,145 Z" fill="url(#chromeGrad)" stroke="#4d5e73" stroke-width="1.5" />

    <!-- Right Arm supporting on knee -->
    <path d="M-60,35 Q-95,95 -65,150 Q-45,150 -55,105 Q-55,70 -45,45 Z" fill="#152942" />
    <ellipse cx="-60" cy="155" rx="16" ry="14" fill="#1c2530" stroke="#334456" stroke-width="2" />

    <!-- Head & South Indian Facial Features (Authentic Tamil / South Indian Man) -->
    <!-- Head rotated slightly downward to intently focus on the repair -->
    <g transform="translate(-22, -45) rotate(-6)">
      <!-- Ear with earlobe -->
      <path d="M16,-5 C25,-5 25,18 14,18 C12,18 12,8 14,4 Z" fill="#754225" />
      <path d="M17,0 C21,2 21,12 16,14" stroke="#5c331c" stroke-width="2" fill="none" />

      <!-- Head Base / Jawline -->
      <path d="M-30,-25 Q-32,15 -18,35 Q-2,48 12,38 Q18,25 16,-5 Q10,-35 -20,-30 Z" fill="url(#skinGrad)" />

      <!-- Eyes & Brow (Intently looking down toward chair) -->
      <path d="M-22,-4 Q-12,-10 -2,-6" stroke="#121820" stroke-width="4.5" stroke-linecap="round" fill="none" /> <!-- Eyebrow -->
      <ellipse cx="-12" cy="0" rx="6" ry="3.5" fill="#ffffff" />
      <circle cx="-13" cy="1" r="2.8" fill="#120e0a" /> <!-- Dark iris looking down -->

      <!-- Nose -->
      <path d="M-22,-3 L-26,12 L-17,14" stroke="#5e341b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <!-- Mustache / Stubble & Lips -->
      <path d="M-20,20 Q-14,17 -7,19" stroke="#1a1410" stroke-width="3.5" stroke-linecap="round" fill="none" /> <!-- Trimmed neat mustache -->
      <path d="M-17,25 Q-12,28 -7,25" stroke="#4a2814" stroke-width="2.5" fill="none" /> <!-- Lip line -->

      <!-- Chin -->
      <ellipse cx="-8" cy="38" rx="8" ry="6" fill="#7a4627" />

      <!-- Black Groomed Hair (Thick South Indian wavy / side-part hair) -->
      <path d="M-34,-15 C-42,-35 -30,-58 -10,-60 C12,-62 30,-48 24,-25 C20,-5 18,-15 12,-18 C5,-22 -15,-20 -28,-10 Z" fill="#0d1117" />
      <!-- Hair texture & highlights -->
      <path d="M-25,-45 Q-10,-52 10,-48" stroke="#253242" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M-28,-30 Q-15,-38 5,-36" stroke="#253242" stroke-width="2.5" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- ==================== ON-SITE TECHNICIAN TOOLBOX & PARTS ==================== -->
  <g transform="translate(180, 780)">
    <!-- Heavy Duty Metal Technician Flight Case / Tool Chest -->
    <rect x="-80" y="0" width="160" height="90" rx="8" fill="#1c2530" stroke="#485c73" stroke-width="4" filter="url(#softShadow)" />
    <!-- Chrome Corner Protectors & Locks -->
    <rect x="-80" y="0" width="20" height="20" fill="url(#chromeGrad)" />
    <rect x="60" y="0" width="20" height="20" fill="url(#chromeGrad)" />
    <rect x="-80" y="70" width="20" height="20" fill="url(#chromeGrad)" />
    <rect x="60" y="70" width="20" height="20" fill="url(#chromeGrad)" />
    <rect x="-15" y="35" width="30" height="15" rx="3" fill="url(#chromeGrad)" stroke="#1a222c" stroke-width="2" />

    <!-- Open Lid Compartment showing tools -->
    <polygon points="-75,0 -75,-65 75,-65 75,0" fill="#141c24" stroke="#485c73" stroke-width="3" />
    <!-- Screwdrivers with orange/black grips in rack -->
    <line x1="-55" y1="-55" x2="-55" y2="-10" stroke="#ff7a00" stroke-width="8" stroke-linecap="round" />
    <line x1="-38" y1="-55" x2="-38" y2="-10" stroke="#ff7a00" stroke-width="8" stroke-linecap="round" />
    <line x1="-21" y1="-55" x2="-21" y2="-10" stroke="#ff7a00" stroke-width="8" stroke-linecap="round" />
    <line x1="-4" y1="-55" x2="-4" y2="-10" stroke="#ff7a00" stroke-width="8" stroke-linecap="round" />
    <!-- Wrenches in rack -->
    <line x1="20" y1="-55" x2="20" y2="-10" stroke="url(#chromeGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="38" y1="-55" x2="38" y2="-10" stroke="url(#chromeGrad)" stroke-width="7" stroke-linecap="round" />
    <line x1="56" y1="-55" x2="56" y2="-10" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Lubricant Spray Can (WD-40 / Maintenance Lubricant) -->
    <g transform="translate(100, 20)">
      <rect x="0" y="15" width="26" height="55" rx="6" fill="#005eb8" stroke="#fdb913" stroke-width="3" />
      <rect x="3" y="2" width="20" height="13" rx="2" fill="#e60012" /> <!-- Red Cap -->
      <line x1="23" y1="8" x2="38" y2="2" stroke="#e60012" stroke-width="2" /> <!-- Spray straw -->
    </g>

    <!-- Spare Class 4 Gas Lift Cylinders in tray -->
    <rect x="-60" y="115" width="120" height="18" rx="4" fill="url(#chromeGrad)" stroke="#1a222c" stroke-width="2" />
  </g>

  <!-- Sparkles / Quality Finish Accents in Teal & Gold -->
  <path d="M880,240 Q880,256 896,256 Q880,256 880,272 Q880,256 864,256 Q880,256 880,240 Z" fill="#00e5bf" opacity="0.8" />
  <path d="M940,340 Q940,350 950,350 Q940,350 940,360 Q940,350 930,350 Q940,350 940,340 Z" fill="#f5a524" opacity="0.75" />
  <path d="M120,380 Q120,392 132,392 Q120,392 120,404 Q120,392 108,392 Q120,392 120,380 Z" fill="#00e5bf" opacity="0.75" />

  <!-- Live On-Site Badge in Corner -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="220" height="42" rx="21" fill="#071220" fill-opacity="0.8" stroke="#00e5bf" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" fill="#00e5bf" />
    <text x="42" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">ON-SITE TECHNICIAN</text>
  </g>
</svg>