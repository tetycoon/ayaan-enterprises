<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="images/logo-mark.png">
  <meta name="robots" content="noindex, nofollow">
  <title>Service Desk | Ayaan Enterprises</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
  <!-- Login -->
  <div class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <div class="login-brand"><img src="images/logo.png" alt="Ayaan Enterprises" class="login-logo"><span>Service Desk</span></div>
      <label>Staff PIN<input type="password" id="pin" inputmode="numeric" autocomplete="current-password" required autofocus></label>
      <p class="login-err" id="login-err" hidden>Wrong PIN. Try again.</p>
      <button class="btn btn-amber" type="submit">Log in</button>
      <p class="muted" style="font-size:.82rem;margin:0">Default PIN is 1234. Change it in Settings.</p>
      <a href="index.html" style="font-size:.85rem">← Back to website</a>
    </form>
  </div>

  <!-- App -->
  <div class="app" id="app" hidden>
    <aside class="side">
      <a class="side-brand" href="#/dashboard"><img src="images/logo.png" alt="Ayaan Enterprises" class="side-logo"><small>Service management</small></a>
      <nav class="side-nav" id="side-nav">
        <a href="#/dashboard" data-view="dashboard"><i>▦</i>Dashboard</a>
        <a href="#/enquiries" data-view="enquiries"><i>✉</i>Enquiries<b class="count" id="c-enq"></b></a>
        <a href="#/inspections" data-view="inspections"><i>⌕</i>Site Inspections</a>
        <a href="#/quotes" data-view="quotes"><i>₹</i>Quotations</a>
        <a href="#/jobs" data-view="jobs"><i>⚒</i>Jobs &amp; Schedule</a>
        <a href="#/invoices" data-view="invoices"><i>▤</i>Invoices &amp; Payments</a>
        <a href="#/reports" data-view="reports"><i>▥</i>Reports</a>
        <a href="#/settings" data-view="settings"><i>⚙</i>Settings</a>
      </nav>
      <div class="side-foot">
        <a href="index.html" target="_blank">View website ↗</a>
        <button data-act="logout" class="link-btn">Log out</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar-admin">
        <button class="side-toggle" id="side-toggle" aria-label="Menu">☰</button>
        <h1 id="view-title">Dashboard</h1>
        <div class="top-actions" id="top-actions"></div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="drawer" id="drawer" hidden></div>
  <div id="print-area"></div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
